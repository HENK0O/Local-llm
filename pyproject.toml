[build-system]
requires = ["setuptools>=77", "wheel", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm"
dynamic = ["version"]
description = "A transparent, numerically validated CPU inference runtime for Llama-like models"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "HENK0O" },
]
keywords = ["llm", "inference", "gguf", "numpy", "apple-silicon"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jinja2>=3.1",
  "numpy>=1.24",
  "regex>=2023.0.0",
]

[project.optional-dependencies]
reference = [
  "torch>=2.2",
  "transformers>=4.40,<5",
]

[project.scripts]
local-llm = "local_llm.cli:main"

[tool.setuptools.packages.find]
include = ["local_llm*"]

[tool.setuptools.package-data]
local_llm = ["web/*.html"]

[tool.setuptools.dynamic]
version = { attr = "local_llm.version.__version__" }

[project.urls]
Homepage = "https://github.com/HENK0O/local-llm"
Repository = "https://github.com/HENK0O/local-llm.git"
Issues = "https://github.com/HENK0O/local-llm/issues"
