[build-system]
requires = ["setuptools>=68", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm"
version = "0.9.0"
description = "A minimal NumPy inference runtime for Llama-like language models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "jinja2>=3.1",
  "numpy>=1.24",
  "regex>=2023.0.0",
]

[project.optional-dependencies]
reference = [
  "torch>=2.2",
  "transformers>=4.40,<5",
]

[project.scripts]
local-llm = "local_llm.cli:main"

[tool.setuptools.packages.find]
include = ["local_llm*"]

[tool.setuptools.package-data]
local_llm = ["web/*.html"]
