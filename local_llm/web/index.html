<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interface locale du moteur d’inférence local-llm">
  <title>local-llm — Chat local</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10120f;
      --panel: rgba(31, 34, 28, .88);
      --panel-strong: #242820;
      --line: rgba(232, 238, 216, .12);
      --text: #f2f4ea;
      --muted: #a4aa98;
      --accent: #d9ff72;
      --accent-dark: #1e2b0a;
      --user: #384425;
      --danger: #ff9a8d;
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 10%, rgba(166, 214, 89, .12), transparent 30%),
        radial-gradient(circle at 82% 90%, rgba(94, 136, 85, .10), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, textarea, input { font: inherit; }

    .shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      height: 100vh;
      max-width: 1500px;
      margin: 0 auto;
    }

    aside {
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding: 30px 24px;
      border-right: 1px solid var(--line);
      background: rgba(12, 14, 11, .45);
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--accent);
      color: #11150b;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 900;
      box-shadow: 0 0 30px rgba(217, 255, 114, .15);
    }
    .brand strong { display: block; letter-spacing: -.02em; }
    .brand small { color: var(--muted); }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    .status-dot.offline { background: var(--danger); box-shadow: none; }

    .model-card, .settings {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    #modelName { margin: 0; overflow-wrap: anywhere; font-size: 14px; line-height: 1.45; }

    .settings { display: grid; gap: 17px; }
    .control-row { display: grid; gap: 8px; }
    .control-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .clear {
      margin-top: auto;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .clear:hover { color: var(--text); border-color: rgba(232, 238, 216, .3); }

    main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 82px;
      padding: 18px clamp(22px, 5vw, 70px);
      border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: clamp(20px, 3vw, 28px); letter-spacing: -.04em; }
    header span { color: var(--muted); font-size: 13px; }

    #conversation {
      overflow-y: auto;
      padding: 32px clamp(22px, 7vw, 100px) 22px;
      scroll-behavior: smooth;
    }

    .welcome {
      display: grid;
      place-content: center;
      min-height: 100%;
      max-width: 680px;
      margin: auto;
      text-align: center;
    }
    .welcome .kicker { color: var(--accent); font: 700 12px ui-monospace, monospace; letter-spacing: .16em; }
    .welcome h2 { margin: 14px 0 12px; font-size: clamp(34px, 6vw, 64px); line-height: .98; letter-spacing: -.055em; }
    .welcome p { margin: 0 auto; max-width: 540px; color: var(--muted); line-height: 1.65; }
    .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 28px; }
    .suggestion {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .02);
      color: var(--text);
      cursor: pointer;
    }
    .suggestion:hover { border-color: var(--accent); color: var(--accent); }

    .message { display: grid; gap: 8px; max-width: 760px; margin: 0 auto 26px; }
    .message.user { justify-items: end; }
    .message-role { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .bubble {
      max-width: min(100%, 680px);
      padding: 15px 18px;
      border: 1px solid var(--line);
      border-radius: 18px 18px 18px 5px;
      background: var(--panel);
      line-height: 1.62;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user .bubble { border-radius: 18px 18px 5px 18px; background: var(--user); }
    .assistant.pending .bubble::after {
      content: "";
      display: inline-block;
      width: 7px;
      height: 16px;
      margin-left: 4px;
      vertical-align: -2px;
      background: var(--accent);
      animation: blink .85s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .composer-wrap { padding: 16px clamp(18px, 6vw, 88px) 24px; }
    .composer {
      max-width: 820px;
      margin: auto;
      padding: 10px 10px 10px 18px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      border: 1px solid rgba(217, 255, 114, .24);
      border-radius: var(--radius);
      background: var(--panel-strong);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .25);
    }
    textarea {
      flex: 1;
      min-height: 44px;
      max-height: 150px;
      padding: 11px 2px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      line-height: 1.45;
    }
    textarea::placeholder { color: #7e8475; }
    .send {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 15px;
      background: var(--accent);
      color: #12170a;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
    }
    .send:hover { filter: brightness(1.08); }
    .send:disabled { cursor: not-allowed; opacity: .45; }
    .hint { max-width: 820px; margin: 9px auto 0; color: var(--muted); text-align: center; font-size: 11px; }
    #metrics { color: var(--accent); }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .shell { grid-template-columns: 1fr; height: 100dvh; }
      aside { display: none; }
      header { min-height: 64px; padding: 13px 18px; }
      header span { display: none; }
      #conversation { padding: 22px 16px; }
      .composer-wrap { padding: 10px 12px 16px; }
      .welcome h2 { font-size: 42px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #conversation { scroll-behavior: auto; }
      .assistant.pending .bubble::after { animation: none; }
    }

    /* Minimal local-runtime theme. */
    :root {
      --bg: #0d0d0d;
      --panel: #141414;
      --panel-strong: #171717;
      --line: #292929;
      --text: #ededed;
      --muted: #858585;
      --accent: #78d786;
      --danger: #e88078;
    }

    body {
      background: var(--bg);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      grid-template-columns: 1fr;
      grid-template-rows: 58px minmax(0, 1fr) auto;
      max-width: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 20px;
      min-width: 0;
      min-height: 0;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }

    .brand {
      display: block;
      flex: 0 0 auto;
      font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: -.02em;
    }

    .model-line {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin-right: auto;
      padding-left: 20px;
      border-left: 1px solid var(--line);
      color: var(--muted);
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      background: var(--accent);
      box-shadow: none;
    }

    #statusText { color: #666; }
    #modelName {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: #bdbdbd;
      font-size: inherit;
      line-height: normal;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .clear {
      flex: 0 0 auto;
      margin: 0;
      padding: 7px 10px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }

    .clear:hover { color: var(--text); border-color: #404040; }

    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .benchmark-button { color: #bcbcbc; }

    dialog {
      width: min(880px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      padding: 0;
      overflow: hidden;
      border: 1px solid #343434;
      border-radius: 10px;
      background: #111;
      color: var(--text);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .65);
    }

    dialog::backdrop { background: rgba(0, 0, 0, .72); }
    .benchmark-shell { display: grid; max-height: calc(100vh - 48px); }
    .benchmark-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--line);
    }
    .benchmark-head h2 { margin: 0 0 5px; font-size: 16px; font-weight: 600; }
    .benchmark-head p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .dialog-close {
      padding: 3px 7px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
    }
    .benchmark-body { padding: 20px 22px 22px; overflow-y: auto; }
    .benchmark-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
    .benchmark-form textarea {
      min-height: 64px;
      padding: 11px 12px;
      border: 1px solid #343434;
      border-radius: 7px;
      background: #181818;
    }
    .benchmark-run {
      align-self: stretch;
      padding: 0 18px;
      border: 1px solid #3d4d40;
      border-radius: 7px;
      background: #1d2920;
      color: #b9e7c0;
      cursor: pointer;
    }
    .benchmark-run:disabled { opacity: .5; cursor: wait; }
    .benchmark-options {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      color: #707070;
      font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .benchmark-options input { width: 90px; accent-color: #777; }
    .benchmark-summary {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding: 11px 13px;
      border: 1px solid #2c2c2c;
      border-radius: 7px;
      color: #aaa;
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .benchmark-summary.visible { display: flex; }
    .benchmark-summary.pass { border-color: #29452f; color: #8bd398; }
    .benchmark-summary.fail { border-color: #55312e; color: var(--danger); }
    .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .comparison-card { min-width: 0; padding: 15px; border: 1px solid #292929; border-radius: 7px; background: #151515; }
    .comparison-card h3 {
      margin: 0 0 11px;
      color: #999;
      font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 500;
    }
    .comparison-output { min-height: 70px; margin: 0 0 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .comparison-stats { display: grid; gap: 5px; color: #777; font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .benchmark-error { margin: 16px 0 0; color: var(--danger); font-size: 12px; }

    #conversation {
      padding: 38px 20px 28px;
      scrollbar-color: #303030 transparent;
    }

    .welcome {
      display: flex;
      flex-direction: column;
      justify-content: center;
      place-content: initial;
      min-height: 100%;
      max-width: 720px;
      text-align: left;
    }

    .prompt-symbol {
      margin-bottom: 20px;
      color: var(--accent);
      font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .welcome h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 500;
      letter-spacing: -.045em;
    }

    .welcome p { margin: 0; max-width: 560px; line-height: 1.6; }

    .suggestions {
      display: grid;
      justify-content: stretch;
      gap: 8px;
      max-width: 480px;
      margin-top: 32px;
    }

    .suggestion {
      padding: 11px 13px;
      border-radius: 6px;
      background: transparent;
      color: #b7b7b7;
      text-align: left;
    }

    .suggestion::before {
      content: "> ";
      color: #5f5f5f;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .suggestion:hover { border-color: #404040; background: var(--panel); color: var(--text); }

    .message,
    .message.user {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      justify-items: stretch;
      gap: 18px;
      max-width: 820px;
      margin: 0 auto;
      padding: 22px 0;
      border-bottom: 1px solid #1d1d1d;
    }

    .message-role {
      padding-top: 2px;
      color: #626262;
      font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0;
      text-transform: lowercase;
    }

    .bubble,
    .user .bubble {
      max-width: none;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      line-height: 1.65;
    }

    .user .bubble { color: #c4c4c4; }
    .assistant.pending .bubble::after { background: var(--accent); }

    .composer-wrap {
      padding: 10px 20px 18px;
      border-top: 1px solid var(--line);
      background: var(--bg);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 18px;
      max-width: 820px;
      min-height: 30px;
      margin: 0 auto 7px;
      color: #666;
      font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .control-row { display: flex; align-items: center; gap: 8px; }
    .control-label { display: inline; color: #666; white-space: nowrap; }
    .control-label output { color: #aaa; }
    input[type="range"] { width: 76px; accent-color: #777; }
    #metrics { margin-left: auto; color: #949494; white-space: nowrap; }

    .composer {
      padding: 7px 7px 7px 14px;
      gap: 8px;
      border-color: #383838;
      border-radius: 8px;
      background: var(--panel-strong);
      box-shadow: none;
    }

    .composer:focus-within { border-color: #515151; }

    textarea {
      min-height: 42px;
      padding: 10px 0;
    }

    textarea::placeholder { color: #5f5f5f; }

    .send {
      width: 42px;
      height: 42px;
      border: 1px solid #383838;
      border-radius: 6px;
      background: #252525;
      color: #d8d8d8;
      font-size: 17px;
      font-weight: 500;
    }

    .send:hover { filter: none; background: #303030; }
    .hint { margin-top: 8px; color: #555; text-align: left; font-size: 10px; }

    @media (max-width: 680px) {
      body { overflow: hidden; }
      .shell { height: 100dvh; grid-template-rows: 54px minmax(0, 1fr) auto; }
      .topbar { min-height: 0; gap: 12px; padding: 0 13px; }
      .topbar span { display: inline; }
      .model-line { padding-left: 12px; }
      #statusText, .model-line > span:nth-child(3) { display: none; }
      .clear { padding: 5px 8px; font-size: 0; }
      .clear::after { content: "+"; font-size: 18px; }
      .benchmark-button { font-size: 11px; }
      .benchmark-button::after { content: none; }
      .comparison-grid { grid-template-columns: 1fr; }
      .benchmark-form { grid-template-columns: 1fr; }
      .benchmark-run { min-height: 42px; }
      #conversation { padding: 24px 15px 18px; }
      .welcome h1 { font-size: 32px; }
      .message, .message.user { grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 18px 0; }
      .composer-wrap { padding: 8px 10px 12px; }
      .controls { gap: 10px; overflow: hidden; }
      .control-row input { width: 58px; }
      #metrics { overflow: hidden; text-overflow: ellipsis; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">local-llm</div>
      <div class="model-line" title="Modèle chargé">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">connexion</span>
        <span>·</span>
        <span id="modelName">chargement…</span>
      </div>
      <div class="topbar-actions">
        <button class="clear benchmark-button" id="benchmarkButton" type="button">Comparer</button>
        <button class="clear" id="clearButton" type="button">Nouvelle conversation</button>
      </div>
    </header>

    <section id="conversation" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="prompt-symbol">$ local-llm run --local</div>
        <div class="suggestions">
          <button class="suggestion" type="button">Présente-toi en français.</button>
          <button class="suggestion" type="button">Combien font 17 × 6 ?</button>
          <button class="suggestion" type="button">Écris une phrase positive.</button>
        </div>
      </div>
    </section>

    <div class="composer-wrap">
      <div class="controls">
        <label class="control-row">
          <span class="control-label">temp <output id="temperatureValue">0.0</output></span>
          <input id="temperature" type="range" min="0" max="1.5" step="0.1" value="0" aria-label="Température">
        </label>
        <label class="control-row">
          <span class="control-label">max <output id="tokensValue">120</output></span>
          <input id="maxTokens" type="range" min="16" max="256" step="8" value="120" aria-label="Tokens maximum">
        </label>
        <span id="metrics">prêt</span>
      </div>
      <form class="composer" id="composer">
        <textarea id="prompt" rows="1" placeholder="Message…" aria-label="Message"></textarea>
        <button class="send" id="sendButton" type="submit" aria-label="Envoyer">↑</button>
      </form>
      <div class="hint">Entrée pour envoyer · Maj + Entrée pour une nouvelle ligne</div>
    </div>
  </div>

  <dialog id="benchmarkDialog">
    <div class="benchmark-shell">
      <header class="benchmark-head">
        <div>
          <h2>Comparer l’inférence</h2>
          <p id="referenceDescription">local-llm optimisé face au recalcul complet</p>
        </div>
        <button class="dialog-close" id="benchmarkClose" type="button" aria-label="Fermer">×</button>
      </header>
      <div class="benchmark-body">
        <form class="benchmark-form" id="benchmarkForm">
          <textarea id="benchmarkPrompt" rows="2" aria-label="Question de test">Explique simplement à quoi sert le format GGUF.</textarea>
          <button class="benchmark-run" id="benchmarkRun" type="submit">Lancer le test</button>
        </form>
        <label class="benchmark-options">
          tokens <output id="benchmarkTokensValue">8</output>
          <input id="benchmarkTokens" type="range" min="2" max="32" step="2" value="8">
          <span>· génération gloutonne identique</span>
        </label>
        <div class="benchmark-summary" id="benchmarkSummary"></div>
        <div class="comparison-grid" id="comparisonGrid" hidden>
          <article class="comparison-card">
            <h3 id="optimizedName">local-llm optimisé</h3>
            <p class="comparison-output" id="optimizedOutput"></p>
            <div class="comparison-stats" id="optimizedStats"></div>
          </article>
          <article class="comparison-card">
            <h3 id="baselineName">référence</h3>
            <p class="comparison-output" id="baselineOutput"></p>
            <div class="comparison-stats" id="baselineStats"></div>
          </article>
        </div>
        <p class="benchmark-error" id="benchmarkError" hidden></p>
      </div>
    </div>
  </dialog>

  <script>
    const conversation = document.querySelector('#conversation');
    const composer = document.querySelector('#composer');
    const promptInput = document.querySelector('#prompt');
    const sendButton = document.querySelector('#sendButton');
    const clearButton = document.querySelector('#clearButton');
    const benchmarkButton = document.querySelector('#benchmarkButton');
    const benchmarkDialog = document.querySelector('#benchmarkDialog');
    const metrics = document.querySelector('#metrics');
    const temperature = document.querySelector('#temperature');
    const maxTokens = document.querySelector('#maxTokens');
    const defaultSystemMessage = {
      role: 'system',
      content: 'Tu es un assistant utile. Réponds en français, sauf si l’utilisateur demande une autre langue.'
    };
    const messages = [{ ...defaultSystemMessage }];
    let generating = false;
    let controller = null;

    function setStatus(ok, text) {
      document.querySelector('#statusDot').classList.toggle('offline', !ok);
      document.querySelector('#statusText').textContent = text;
    }

    async function loadStatus() {
      try {
        const response = await fetch('/health');
        if (!response.ok) throw new Error('indisponible');
        const health = await response.json();
        document.querySelector('#modelName').textContent = health.model;
        document.querySelector('#referenceDescription').textContent = health.external_reference
          ? `local-llm optimisé face à ${health.benchmark_reference}`
          : 'local-llm optimisé face au même moteur sans cache KV';
        document.title = `${health.model} · local-llm`;
        setStatus(true, 'Moteur prêt');
      } catch (_) {
        setStatus(false, 'Serveur indisponible');
        document.querySelector('#modelName').textContent = 'Aucun modèle';
      }
    }

    function addMessage(role, content = '') {
      conversation.querySelector('.welcome')?.remove();
      const row = document.createElement('article');
      row.className = `message ${role}`;
      const label = document.createElement('div');
      label.className = 'message-role';
      label.textContent = role === 'user' ? 'Toi' : 'local-llm';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = content;
      row.append(label, bubble);
      conversation.append(row);
      conversation.scrollTop = conversation.scrollHeight;
      return { row, bubble };
    }

    function setGenerating(value) {
      generating = value;
      sendButton.disabled = false;
      sendButton.textContent = value ? '■' : '↑';
      sendButton.setAttribute('aria-label', value ? 'Arrêter' : 'Envoyer');
      promptInput.disabled = value;
    }

    function formatBytes(bytes) {
      return `${(bytes / 1024 / 1024).toFixed(1)} Mio KV`;
    }

    function speed(value) {
      return value > 0 ? `${value.toFixed(1)} tok/s` : 'non mesuré';
    }

    function renderBenchmarkSide(stats, target) {
      target.replaceChildren();
      const values = [
        `prefill  ${speed(stats.prefill_tokens_per_second)}`,
        `decode   ${speed(stats.decode_tokens_per_second)}`,
        `cache KV ${(stats.kv_cache_bytes / 1024 / 1024).toFixed(1)} Mio`,
      ];
      values.forEach(value => {
        const line = document.createElement('span');
        line.textContent = value;
        target.append(line);
      });
    }

    async function runBenchmark(event) {
      event.preventDefault();
      const run = document.querySelector('#benchmarkRun');
      const summary = document.querySelector('#benchmarkSummary');
      const error = document.querySelector('#benchmarkError');
      const grid = document.querySelector('#comparisonGrid');
      run.disabled = true;
      run.textContent = 'Test en cours…';
      summary.className = 'benchmark-summary visible';
      summary.textContent = 'Calcul des deux passages…';
      error.hidden = true;
      grid.hidden = true;
      try {
        const response = await fetch('/v1/benchmark', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: document.querySelector('#benchmarkPrompt').value,
            tokens: Number(document.querySelector('#benchmarkTokens').value),
          }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error?.message || `Erreur HTTP ${response.status}`);
        document.querySelector('#optimizedName').textContent = result.optimized.name;
        document.querySelector('#baselineName').textContent = result.baseline.name;
        document.querySelector('#optimizedOutput').textContent = result.optimized.text || '∅';
        document.querySelector('#baselineOutput').textContent = result.baseline.text || '∅';
        renderBenchmarkSide(result.optimized, document.querySelector('#optimizedStats'));
        renderBenchmarkSide(result.baseline, document.querySelector('#baselineStats'));
        const comparison = result.comparison;
        summary.className = `benchmark-summary visible ${result.passed ? 'pass' : 'fail'}`;
        summary.textContent = result.passed
          ? `✓ mêmes tokens · erreur logits max ${comparison.max_absolute_error.toExponential(2)}`
          : `✕ différence détectée · erreur logits max ${comparison.max_absolute_error.toExponential(2)}`;
        grid.hidden = false;
      } catch (reason) {
        summary.className = 'benchmark-summary visible fail';
        summary.textContent = 'Le test a échoué';
        error.textContent = reason.message;
        error.hidden = false;
      } finally {
        run.disabled = false;
        run.textContent = 'Lancer le test';
      }
    }

    async function submitMessage(text) {
      const clean = text.trim();
      if (!clean || generating) return;
      messages.push({ role: 'user', content: clean });
      addMessage('user', clean);
      promptInput.value = '';
      promptInput.style.height = 'auto';

      const assistant = addMessage('assistant');
      assistant.row.classList.add('pending');
      let answer = '';
      controller = new AbortController();
      setGenerating(true);
      metrics.textContent = 'Génération…';

      try {
        const response = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({
            messages,
            max_tokens: Number(maxTokens.value),
            temperature: Number(temperature.value),
            top_p: Number(temperature.value) > 0 ? 0.9 : null,
            stream: true
          })
        });
        if (!response.ok || !response.body) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.error?.message || `Erreur HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let done = false;
        while (!done) {
          const chunk = await reader.read();
          done = chunk.done;
          buffer += decoder.decode(chunk.value || new Uint8Array(), { stream: !done });
          const blocks = buffer.split('\n\n');
          buffer = blocks.pop() || '';
          for (const block of blocks) {
            const line = block.split('\n').find(value => value.startsWith('data: '));
            if (!line) continue;
            const data = line.slice(6);
            if (data === '[DONE]') continue;
            const event = JSON.parse(data);
            if (event.error) throw new Error(event.error.message);
            const content = event.choices?.[0]?.delta?.content;
            if (content) {
              answer += content;
              assistant.bubble.textContent = answer;
              conversation.scrollTop = conversation.scrollHeight;
            }
            if (event.local_llm) {
              metrics.textContent = `${event.local_llm.decode_tokens_per_second.toFixed(1)} tok/s · ${formatBytes(event.local_llm.kv_cache_bytes)}`;
            }
          }
        }
        if (answer) messages.push({ role: 'assistant', content: answer });
      } catch (error) {
        if (error.name === 'AbortError') {
          metrics.textContent = 'Génération arrêtée';
          if (answer) messages.push({ role: 'assistant', content: answer });
        } else {
          assistant.bubble.textContent = `Erreur : ${error.message}`;
          assistant.bubble.style.color = 'var(--danger)';
          metrics.textContent = 'Erreur';
        }
      } finally {
        assistant.row.classList.remove('pending');
        controller = null;
        setGenerating(false);
        promptInput.focus();
      }
    }

    composer.addEventListener('submit', event => {
      event.preventDefault();
      if (generating) controller?.abort();
      else submitMessage(promptInput.value);
    });
    promptInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });
    promptInput.addEventListener('input', () => {
      promptInput.style.height = 'auto';
      promptInput.style.height = `${Math.min(promptInput.scrollHeight, 150)}px`;
    });
    temperature.addEventListener('input', () => {
      document.querySelector('#temperatureValue').textContent = Number(temperature.value).toFixed(1);
    });
    maxTokens.addEventListener('input', () => {
      document.querySelector('#tokensValue').textContent = maxTokens.value;
    });
    clearButton.addEventListener('click', () => {
      if (generating) controller?.abort();
      messages.splice(0, messages.length, { ...defaultSystemMessage });
      conversation.replaceChildren();
      const reset = document.createElement('div');
      reset.className = 'welcome';
      reset.innerHTML = '<div class="prompt-symbol">$ clear --history</div>';
      conversation.append(reset);
      metrics.textContent = 'Prêt';
    });
    benchmarkButton.addEventListener('click', () => benchmarkDialog.showModal());
    document.querySelector('#benchmarkClose').addEventListener('click', () => benchmarkDialog.close());
    document.querySelector('#benchmarkForm').addEventListener('submit', runBenchmark);
    document.querySelector('#benchmarkTokens').addEventListener('input', event => {
      document.querySelector('#benchmarkTokensValue').textContent = event.target.value;
    });
    benchmarkDialog.addEventListener('click', event => {
      if (event.target === benchmarkDialog) benchmarkDialog.close();
    });
    document.querySelectorAll('.suggestion').forEach(button => {
      button.addEventListener('click', () => submitMessage(button.textContent));
    });

    loadStatus();
    promptInput.focus();
  </script>
</body>
</html>
